<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stratego Lab</title>
<meta name="description" content="Play Stratego against measured computer players or friends online, with live odds for every hidden piece, a setup analyzer built on 42,000 real games, and a study replay.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=6">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c; --red: #c9473d; --blue: #3b6fd4;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 12px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* ------------------------------------------------ tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 14px 18px; }
  }

  /* ------------------------------------------------ common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.small { min-height: 40px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 3px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; position: relative; }
  .q::after { content: ""; position: absolute; inset: -11px; } /* a 42px tap area around the small circle */
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 750; }
  .txt { font: inherit; font-size: 16px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; padding: 0 12px; width: 100%; min-width: 0; }
  .txt.code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; flex: 1; }
  .code-big { font-size: 36px; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  .icon-btn { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:active:not(:disabled) { transform: scale(.94); }
  .icon-btn:disabled { opacity: .38; }
  .scroll.fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); padding-bottom: 18px; }
  .icon-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(110,168,254,.12); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80; animation: up .2s; max-width: calc(100vw - 32px); pointer-events: none; } /* taps go through to the buttons under it */
  @keyframes up { from { transform: translate(-50%, 16px); opacity: .3; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .confirm-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
  .confirm-back .panel { max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 12px; }

  /* ------------------------------------------------ board */
  .bwrap { position: relative; width: 100%; aspect-ratio: 1; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.45); border: 2px solid #23311f;
    container-type: size; transition: border-color .25s, box-shadow .25s; }
  /* your turn: the board's frame lights up in your colour */
  .bwrap.turn-0 { border-color: #c9473d; box-shadow: 0 0 0 1px rgba(201,71,61,.35), 0 0 22px rgba(201,71,61,.32), 0 4px 18px rgba(0,0,0,.45); }
  .bwrap.turn-1 { border-color: #3b6fd4; box-shadow: 0 0 0 1px rgba(59,111,212,.35), 0 0 22px rgba(59,111,212,.32), 0 4px 18px rgba(0,0,0,.45); }
  .bwrap > svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cell { position: absolute; width: 10%; height: 10%; }
  .cell.hit { cursor: pointer; }
  .cell.dest::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: rgba(240,179,84,.75); }
  .cell.last { background: rgba(240,179,84,.24); box-shadow: inset 0 0 0 1.5px rgba(240,179,84,.45); }
  .pc { position: absolute; width: 10%; height: 10%; padding: 1.5px; transition: left .26s ease, top .26s ease, opacity .3s, transform .15s; pointer-events: none; }
  .pc svg { width: 100%; height: 100%; display: block; }
  .pc.sel { transform: scale(1.08) translateY(-3%); z-index: 3; filter: drop-shadow(0 0 4px rgba(240,179,84,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
  .pc.focus { z-index: 2; }
  .pc.focus::before { content: ""; position: absolute; inset: 0; border-radius: 7px; box-shadow: 0 0 0 2.5px #ffe08a, 0 0 10px rgba(255,224,138,.7); animation: fade .2s; }
  .pc.gone { opacity: 0; transform: scale(.6); }
  .pc .badge { position: absolute; right: 1px; bottom: 1px; font-size: clamp(10px, 3.45cqw, 16px); font-weight: 700; line-height: 1; padding: .22em .24em; border-radius: .35em; background: rgba(10,12,18,.84); color: #f0c77e; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pc .badge b { color: #fff; font-weight: 850; margin-right: .22em; }
  .pc .badge.top { left: 1px; right: auto; top: 1px; bottom: auto; }
  .pc .seen { position: absolute; right: 2px; top: 2px; width: 7px; height: 7px; border-radius: 50%; background: #ffe08a; box-shadow: 0 0 0 1.5px rgba(0,0,0,.5); }
  .pc .moved { position: absolute; left: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  .heat { position: absolute; width: 10%; height: 10%; pointer-events: none; }
  .fight { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px;
    background: rgba(15,17,23,.92); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; animation: pop .22s ease-out; pointer-events: none; }
  .fight .fp { width: clamp(58px, 11cqw, 84px); height: clamp(58px, 11cqw, 84px); transition: transform .3s, opacity .3s, filter .3s; }
  .fight .fp svg { width: 100%; height: 100%; }
  .fight .fp.lose { animation: knocked .45s .35s ease-in both; }
  .fight .fp.win { animation: winner .4s .3s ease-out both; }
  @keyframes knocked { 0% { transform: none; } 30% { transform: translateX(-4px) rotate(-6deg); } 100% { transform: scale(.82) rotate(8deg); opacity: .35; filter: grayscale(1); } }
  @keyframes winner { 0% { transform: none; } 50% { transform: scale(1.12); } 100% { transform: scale(1.04); } }
  .fight .vs { font-weight: 800; color: var(--accent-warm); font-size: 14px; text-align: center; min-width: 54px; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

  /* ------------------------------------------------ play layout */
  #game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
  .gstatus { display: flex; align-items: center; gap: 6px; min-height: 36px; }
  .turnchip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; }
  .turnchip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .turnchip .st { font-size: 16px; font-weight: 800; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  .turnchip .sub { flex-shrink: 50; min-width: 0; } /* a long name: the last-move line gives way first, then "…" */
  .turnchip.mine .st { color: #fff; }
  .turnchip .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .turnchip .sub { color: var(--muted); font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
  .boardcol { display: flex; justify-content: center; flex: none; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; height: 112px; overflow: hidden; flex: none; }
  .gacts { display: flex; gap: 8px; flex: none; }
  .gacts .btn { flex: 1; }
  .side { display: none; }
  .ranks { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; align-items: end; }
  .rk { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
  .rk .mini { width: 100%; max-width: 26px; aspect-ratio: 1; }
  .rk .mini svg { width: 100%; height: 100%; display: block; }
  .rk b { color: var(--text); font-size: 12px; }
  .rk.zero { opacity: .35; }
  .pbar { width: 100%; max-width: 22px; height: 30px; background: var(--bg-soft); border-radius: 3px; position: relative; overflow: hidden; }
  .pbar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 3px 3px 0 0; transition: height .2s; }
  .pbar.hi i { background: var(--accent-warm); }
  .rk .pv { font-size: 10px; line-height: 11px; height: 11px; color: var(--muted); font-weight: 600; }
  .infohead { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 5px; min-height: 20px; }
  .infohead b { font-size: 13.5px; }
  .fightline { display: flex; gap: 14px; font-size: 13px; margin-top: 4px; }
  /* phone strip: one-line heading, and shorter bars when the fight line is there, so it is never cut off */
  .info .infohead { white-space: nowrap; }
  .info .infohead > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .info .infohead > .q { overflow: visible; }
  .info .ranks:has(+ .fightline) .pbar { height: 18px; }
  .gacts .btn.out { flex: none; padding: 0 12px; }
  @media (max-width: 899px) {
    #v-play { padding-top: 5px; padding-bottom: 5px; }
    #game { gap: 5px; }
    /* upright phone: the status is one short line of fixed height (odds/hint sit in the button row), so the board never resizes on a tap */
    .gstatus { min-height: 0; height: 26px; flex: none; }
    .gacts .icon-btn { height: 44px; }
  }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
  ul.log li { color: var(--muted); }
  ul.log li.me { color: var(--text); }
  ul.log li .n { color: #59607a; font-variant-numeric: tabular-nums; margin-right: 5px; }
  @media (min-width: 900px) {
    #game { display: grid; grid-template-columns: auto minmax(320px, 400px); grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; justify-content: center; }
    /* the board takes the full height on the left; the status line heads the side column */
    .gstatus { grid-column: 2; grid-row: 1; height: 52px; }
    .turnchip { flex-wrap: wrap; row-gap: 0; align-content: center; }
    .turnchip .sub { flex-basis: 100%; padding-left: 18px; }
    .boardcol { grid-column: 1; grid-row: 1 / 3; align-items: flex-start; }
    /* their army in two rows, so each piece is big enough to read */
    #army-side .ranks.army { grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 8px; }
    #army-side .rk .mini { max-width: 40px; }
    .side { display: flex; grid-column: 2; grid-row: 2; flex-direction: column; gap: 10px; min-height: 0; }
    .side .panel { padding: 12px 14px; }
    .side .logbox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #info-phone, #acts-phone { display: none; }
    .info { height: auto; }
    #info-side { height: 132px; flex: none; overflow: hidden; } /* fixed, so tapping a piece never moves the panels below */
    #info-side .pbar { height: 40px; max-width: 24px; }
    #info-side:has(> .ph) { background: transparent; border-style: dashed; display: flex; align-items: center; justify-content: center; }
    #info-side .ph { margin: 0; }
    .infohead { font-size: 14px; }
    .infohead b { font-size: 15px; }
    .rk { font-size: 11.5px; }
    .rk b { font-size: 13px; }
    ul.log { font-size: 13.5px; gap: 3px; }
    .gstatus { min-height: 44px; }
    .turnchip .st { font-size: 18px; }
    .turnchip .sub { font-size: 13.5px; }
  }

  /* ------------------------------------------------ new game / lobby */
  .setup { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
  @media (min-width: 900px) { .setup { justify-content: center; padding-bottom: 6vh; } }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img { width: 46px; height: 46px; border-radius: 10px; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .setup .panel { display: flex; flex-direction: column; gap: 10px; }
  .seats { display: flex; flex-direction: column; gap: 6px; }
  .seatrow { display: flex; align-items: center; gap: 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 14px; min-height: 42px; }
  .seatrow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* ------------------------------------------------ setup tab */
  .su { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .sugrid { position: relative; width: 100%; aspect-ratio: 10 / 4; border-radius: 10px; overflow: hidden; border: 2px solid #23311f; background: #2f4a33; flex: none; }
  .sucell { position: absolute; width: 10%; height: 25%; padding: 1.5px; cursor: pointer; transition: left .22s ease, top .22s ease; }
  .sucell svg { width: 100%; height: 100%; display: block; }
  .sucell.sel { z-index: 2; filter: drop-shadow(0 0 4px rgba(240,179,84,.95)); transform: scale(1.06); }
  .sucell.empty::before { content: ""; position: absolute; inset: 3px; border: 1.5px dashed rgba(255,255,255,.18); border-radius: 6px; }
  .sugrid .ghost { position: absolute; inset: 0; pointer-events: none; }
  /* heat map: the colour sits on the board under the pieces; pieces turn see-through grey so it shows */
  .sugrid.heaton .sucell { opacity: .62; filter: grayscale(1); }
  .sugrid.heaton .ghost { z-index: 0; }
  .sutools { display: flex; gap: 6px; flex-wrap: wrap; }
  .sutools .btn { flex: 1; }
  .checks { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .chk { display: flex; gap: 8px; align-items: flex-start; }
  .chk .mk { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; margin-top: 1px; color: #10131a; }
  .chk.good .mk { background: var(--good); }
  .chk.warn .mk { background: var(--accent-warm); }
  .chk.bad .mk { background: var(--bad); }
  .heatpick { display: flex; gap: 4px; overflow-x: auto; }
  .heatpick button { flex: 1 0 32px; min-width: 32px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-soft); cursor: pointer; font-weight: 700; font-size: 12.5px; padding: 0 6px; }
  .heatpick button[aria-pressed="true"] { border-color: var(--accent-warm); color: var(--accent-warm); }
  .big { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sumrow { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  @media (min-width: 900px) {
    .su { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px 18px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .su .su-head { grid-column: 1; }
    .su .su-grid { grid-column: 1; }
    .su .su-tools { grid-column: 1; }
    .su .su-side { grid-column: 2; grid-row: 1 / 4; min-height: 0; }
  }

  /* ------------------------------------------------ study */
  .study { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .study .stepper { display: flex; gap: 6px; align-items: center; }
  .study input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  table.turns { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.turns th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 5px; position: sticky; top: 0; z-index: 1; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 -6px 0 var(--card); }
  table.turns td { padding: 5px 5px; border-top: 1px solid #222838; vertical-align: top; }
  table.turns tr.cur td { background: rgba(110,168,254,.1); }
  table.turns tr { cursor: pointer; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  .chart svg { width: 100%; height: 30px; display: block; }
  @media (max-width: 899px) {
    .study .st-side.panel { padding: 9px 11px; }
    table.turns td { padding: 4px 5px; }
    table.turns th { padding: 2px 5px; }
  }
  @media (min-width: 900px) { .chart svg { height: 84px; } }
  .tabs2 { display: flex; gap: 6px; }
  .tabs2 button { flex: 1; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-soft); cursor: pointer; font-weight: 650; font-size: 13.5px; }
  .tabs2 button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(110,168,254,.12); }
  .study .st-side { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .fact .big { font-size: 20px; }
  .fact span { display: block; font-size: 12.5px; color: var(--muted); }
  @media (min-width: 900px) {
    .study { display: grid; grid-template-columns: auto minmax(320px, 420px); grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; justify-content: center; }
    .study .st-top { grid-column: 1 / 3; }
    .study .st-board { grid-column: 1; grid-row: 2; }
    .study .st-side { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .facts { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* ------------------------------------------------ settings */
  .set { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .set > * { flex: none; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .setrow .grow b { display: block; font-weight: 650; }
  .setrow .grow span { font-size: 12.5px; color: var(--muted); }
  .ver { color: #59607a; font-size: 12px; text-align: center; }
  .ver a { color: #59607a; }

  /* ------------------------------------------------ sound & effects (rows drawn by js/fx.js, matched to the rows above) */
  .fx-set .fx-row { border-top: 0; padding: 0; min-height: 46px; }
  .fx-set .fx-lab { font-weight: 650; }
  .fx-set .fx-vol { flex: 1 1 150px; }
  .fx-set .seg { flex: 0 0 180px; }
  .fx-set .fx-why { padding: 0 0 6px; }
  .fx-set .switch { width: 48px; height: 28px; }
  .fx-set .switch span { background: #2f3548; border-radius: 14px; }
  .fx-set .switch span::after { width: 22px; height: 22px; }
  .fx-set .switch input:checked + span { background: var(--accent); }
  .fx-set .switch input:checked + span::after { transform: translateX(20px); }
  .fx-set .seg { background: none; border: 0; padding: 0; gap: 6px; }
  .fx-set .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; color: inherit; font-weight: 650; font-size: 14px; padding: 3px 6px; cursor: pointer; }
  .fx-set .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .fx-set .q { width: 20px; height: 20px; font-size: 12px; background: var(--bg-soft); }
  .fx-set .fx-test { min-height: 40px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; background: var(--card); cursor: pointer; }
  /* Animations off: the board's own motion is instant too; Fast: about half as long */
  .fx-still .pc, .fx-still .sucell, .fx-still .bwrap, .fx-still .pbar i, .fx-still .switch span, .fx-still .switch span::after { transition: none !important; }
  .fx-still .fight, .fx-still .fight .fp, .fx-still .toast, .fx-still .confirm-back, .fx-still .pc.focus::before { animation-duration: 0s !important; animation-delay: 0s !important; }
  .fx-still .turnchip .dot.pulse { animation: none; }
  .fx-fast .pc { transition-duration: .14s, .14s, .16s, .08s; }
  .fx-fast .sucell { transition-duration: .12s; }
  .fx-fast .fight { animation-duration: .12s; }
  .fx-fast .fight .fp.lose { animation-duration: .25s; animation-delay: .19s; }
  .fx-fast .fight .fp.win { animation-duration: .22s; animation-delay: .17s; }

  /* ------------------------------------------------ the real table (css/table.css surface + the folding board) */
  #v-play:not(:has(#game)) { background: var(--bg); }
  #v-play .panel, #v-play .info { background: rgba(18, 20, 28, .84); border-color: rgba(255, 255, 255, .07); box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
  #v-play .gacts .btn { background: rgba(18, 20, 28, .84); border-color: rgba(255, 255, 255, .1); }
  #v-play .gacts .btn.primary { background: var(--accent); border-color: var(--accent); }
  #v-play .gacts .btn.ghost { background: rgba(18, 20, 28, .55); color: #c9cbd4; }
  #v-play .icon-btn { background: rgba(18, 20, 28, .8); border-color: rgba(255, 255, 255, .1); }
  #v-play .icon-btn[aria-pressed="true"] { border-color: var(--accent); background: rgba(30, 44, 70, .9); }
  #v-play .turnchip { text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  #v-play .turnchip .sub { color: #d9cdb8; }
  #v-play .scroll.fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
  /* the board: printed dark-green border, gold rule round the field, the board's thickness and its shadow on the wood */
  .bframe { --fe: 20px; --fs: 4px; position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 var(--fs); border-radius: 5px;
    background: linear-gradient(180deg, #23421f, #1d3a1b 50%, #23421f);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px rgba(0, 0, 0, .35), 0 3px 0 #0f1f0d, 0 4px 0 rgba(0, 0, 0, .4), 0 14px 26px rgba(0, 0, 0, .55); }
  .bframe .bwrap { border-radius: 2px; border-color: #b9994f; box-shadow: 0 0 0 1px rgba(0, 0, 0, .45); }
  .bframe .bwrap.turn-0 { border-color: #c95a4c; box-shadow: 0 0 0 1px rgba(201,71,61,.35), 0 0 26px 3px rgba(224,87,75,.42); }
  .bframe .bwrap.turn-1 { border-color: #5a86d6; box-shadow: 0 0 0 1px rgba(59,111,212,.35), 0 0 26px 3px rgba(91,143,240,.42); }
  /* removed pieces lying in each player's margin, small stacks by rank */
  .grave { height: var(--fe); width: 100%; display: flex; align-items: center; gap: 6px; padding: 0 3px; min-width: 0; overflow: hidden; }
  .grave .gl { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; justify-content: flex-end; }
  .grave.near .gl { justify-content: flex-start; }
  .grave .seat { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: #d6caa2; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; flex: none; }
  .grave .seat i { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
  .gs { position: relative; flex: none; height: calc(var(--fe) - 6px); aspect-ratio: 30 / 40; margin-right: 3px; }
  .gs i { position: absolute; inset: 0; transform: translate(calc(var(--i) * 1.5px), calc(var(--i) * -1.5px)); }
  .gs i:nth-child(2) { z-index: -1; } .gs i:nth-child(3) { z-index: -2; }
  .gs { isolation: isolate; }
  .gs svg { width: 100%; height: 100%; display: block; }
  .gs b { position: absolute; left: calc(100% + 3px); bottom: -1px; z-index: 2; font-size: 10px; line-height: 1; font-weight: 800; color: #eadfbd; text-shadow: 0 1px 1px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums; }
  .gs:has(b) { margin-right: 11px; }
  /* a tap on a margin shows its pieces full size */
  .grave { cursor: pointer; }
  .gbig { display: flex; flex-direction: column; gap: 6px; }
  .gbrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: flex-end; min-height: 36px; }
  .gb { display: inline-flex; align-items: flex-end; gap: 2px; }
  .gb i { width: 27px; height: 36px; display: block; }
  .gb i svg { width: 100%; height: 100%; display: block; }
  .gb b { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  @media (min-width: 900px) {
    .bframe { --fe: 54px; --fs: 14px; border-radius: 8px; margin-top: -56px; }
    .gs { height: calc(var(--fe) - 18px); }
    .grave { gap: 10px; padding: 0 2px; }
    .grave .gl { gap: 9px; }
    .grave .seat { font-size: 12px; }
    .gs b { font-size: 12px; }
    .gs:has(b) { margin-right: 14px; }
    /* the tap-to-enlarge view is bigger than the margin's own pieces */
    .gb i { width: 39px; height: 52px; }
    .gb b { font-size: 15px; }
    .gbrow { min-height: 52px; gap: 8px 10px; }
    /* the board lies on the table in front of you: its far end a little further away */
    .bframe { transform: perspective(1500px) rotateX(11deg); transform-origin: 50% 100%; }
  }
  /* pieces stand on the board: picking one up lifts it, a taken one is lifted off */
  .pc.sel { transform: translateY(-9%) scale(1.1); filter: drop-shadow(0 0 4px rgba(240,179,84,.95)) drop-shadow(0 7px 5px rgba(0,0,0,.5)); }
  .pc.gone { opacity: 0; transform: translateY(-22%) scale(1.12); }
  /* fight: the enemy piece turns round to show its rank, then the loser falls */
  .fight { background: rgba(14, 16, 22, .9); }
  .fight .fp.turn { perspective: 300px; }
  .fight .fp .fl { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: turnup .3s ease-out both; }
  .fight .fp .ff, .fight .fp .fb { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .fight .fp .fb { transform: rotateY(180deg); }
  @keyframes turnup { from { transform: rotateY(180deg); } to { transform: rotateY(0deg); } }
  .fx-still .fight .fp .fl { animation: none; }
  .fx-fast .fight .fp .fl { animation-duration: .17s; }
  @media (max-width: 359px) { .bframe { --fe: 16px; --fs: 3px; } }
  /* a phone on its side: board on the left, the panels beside it */
  @media (max-width: 899px) and (orientation: landscape) and (max-height: 540px) {
    /* the tabs become a rail down the left edge (clear of the notch), so the board gets the full height */
    #app { flex-direction: row; }
    nav.tabs { order: 0; flex-direction: column; height: auto; width: calc(64px + env(safe-area-inset-left)); padding: 4px 0 calc(4px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
      border-top: 0; border-right: 1px solid var(--line); }
    .view { min-width: 0; padding: 8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) 12px; }
    .toast { bottom: calc(14px + env(safe-area-inset-bottom)); left: calc(50% + 32px); }
    /* play: board on the left from top to bottom; status, panel, then [odds][hint][buttons] on the right */
    #game { display: grid; grid-template-columns: auto 44px 44px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px 8px; }
    .gstatus { display: contents; }
    .boardcol { grid-column: 1; grid-row: 1 / 4; align-items: flex-start; margin-right: 4px; }
    .turnchip { grid-column: 2 / 5; grid-row: 1; flex-wrap: wrap; row-gap: 0; min-height: 40px; align-content: center; }
    .turnchip .sub { flex-basis: 100%; padding-left: 18px; }
    .gstatus > .muted { grid-column: 4; grid-row: 1; justify-self: end; align-self: start; padding-top: 4px; }
    .gstatus:has(> .muted) .turnchip { padding-right: 54px; }
    .gstatus [data-a="odds"] { grid-column: 2; grid-row: 3; height: 44px; }
    .gstatus [data-a="hint"] { grid-column: 3; grid-row: 3; height: 44px; }
    #info-phone { grid-column: 2 / 5; grid-row: 2; height: auto; min-height: 0; overflow: auto; }
    #acts-phone { grid-column: 2 / 5; grid-row: 3; flex-wrap: wrap; }
    #game:has(.gstatus [data-a="odds"]) #acts-phone { grid-column: 4; }
    .info .ranks:has(+ .fightline) .pbar { height: 30px; }
    .info .ranks.army { grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 6px; }
    .info .ranks.army .rk .mini { max-width: 34px; }
    .su { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 6px 12px; }
    .su .su-head, .su .su-grid, .su .su-tools { grid-column: 1; }
    .su .su-side { grid-column: 2; grid-row: 1 / 4; min-height: 0; overflow-y: auto; }
    /* the narrow side column: "Test games" drops under the Flag guess instead of being squeezed off the edge */
    .su .sumrow > .grow { flex: 1 0 auto; }
    /* study: the same idea, board left, controls and moves right */
    .study.has { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px 12px; }
    .study.has .st-board { grid-column: 1; grid-row: 1 / 3; align-items: flex-start; }
    .study.has .st-top { grid-column: 2; grid-row: 1; }
    .study.has .st-side { grid-column: 2; grid-row: 2; }
    .study .stepper { flex-wrap: wrap; row-gap: 2px; }
    .study .stepper #st-n { order: 9; flex-basis: 100%; min-width: 0 !important; text-align: left !important; line-height: 1.1; }
    .study.has .st-side .label { white-space: nowrap; }
    /* new game / lobby: two columns of the form so it fits the short screen */
    .setup { max-width: none; }
    .setup:has(.hero) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px 12px; overflow-y: auto; }
    .setup:has(.hero) .hero { grid-column: 1; grid-row: 1; }
    .setup:has(.hero) > .muted { grid-column: 1; grid-row: 2; text-align: left !important; }
    .setup:has(.hero) .panel { grid-column: 2; grid-row: 1 / 3; gap: 7px; }
    .setup .panel .seg button { min-height: 40px; }
    .setup:not(:has(.hero)) { overflow-y: auto; }
  }
  /* setup tab grid: the same printed meadow */
  .sugrid { background: #4f7f3c; border-color: #b9994f; }
</style>
</head>
<body>
<div id="app">
  <nav class="tabs" id="tabs">
    <a class="brand" href="../"><img src="icon.svg" alt="">Stratego Lab</a>
    <button data-tab="play" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21h12M8 21l1-6h6l1 6M12 3v4M9 7h6l-1 8h-4z"/></svg>Play</button>
    <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Setup</button>
    <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Study</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>

  <section class="view on tbl-surface tbl-wood-dark" id="v-play"></section>
  <section class="view" id="v-setup"></section>
  <section class="view" id="v-study"></section>
  <section class="view" id="v-settings"></section>
</div>

<script src="js/engine.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script src="js/odds.js?v=6"></script>
<script src="js/bots.js?v=6"></script>
<script src="js/online-game.js?v=6"></script>
<script src="js/strength-data.js?v=6"></script>
<script src="js/art.js?v=7"></script>
<script src="js/fx.js?v=6"></script>
<script src="js/table.js?v=6"></script>
<script src="js/sfx.js?v=6"></script>
<script src="js/app.js?v=7"></script>
</body>
